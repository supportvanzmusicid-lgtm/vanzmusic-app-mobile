workflows:
  android-debug:
    name: Vanz Music APK Build
    max_build_duration: 30
    instance_type: linux  # Ini mesin standar yang 100% gratis untuk Android
    scripts:
      - name: Build Android APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - support.vanzmusic@gmail.com
